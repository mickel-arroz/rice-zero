<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Proponer Nodos: cargando</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#6b6b6b}a:hover{color:#e7000b}
@keyframes pulse{50%{opacity:.5}}
.sk{display:block;background:#ebebeb;animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #ececec; color: #171717; font-family: Iosevka, ui-monospace, Consolas, monospace; display: flex; align-items: center; justify-content: center; padding: 24px">
  <div role="dialog" aria-label="Proponer Nodos" style="width: 560px; box-sizing: border-box; background: #ffffff; border: 1px solid #dcdcdc; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <p style="margin: 0; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #e7000b"></span><span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; color: #6b6b6b">IA</span></p>
        <h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.01em">Proponer Nodos</h2>
      </div>
      <button type="button" aria-label="Cerrar" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #dcdcdc; background: transparent; display: flex; align-items: center; justify-content: center; color: #171717; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
    </div>

    <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #6b6b6b; border-left: 0; padding: 12px 14px; border-radius: 16px; background: #fafafa; border: 1px solid #dcdcdc">«Que se pueda planificar la semana: menú por días y lista de la compra que salga sola»</p>

    <ul aria-busy="true" aria-label="Proponiendo Nodos" class="mk" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; outline: 2px solid #e7000b; outline-offset: 6px; border-radius: 8px">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
        <li style="display: flex; height: 50px; align-items: stretch">
          <span style="flex-shrink: 0; width: {{row.gutter}}"></span>
          <span class="sk" style="flex: 1; margin: 4px 0; border-radius: 16px"></span>
        </li>
      </sc-for>
    </ul>

    <button type="button" disabled="disabled" style="height: 52px; border: 0; border-radius: 999px; background: #e7000b; opacity: .35; color: #fafafa; font: inherit; font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px">Proponiendo…</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: [0, 1, 1, 0, 1, 2].map((d) => ({ gutter: ((d + 1) * 22) + 'px' })) };
  }
}
</script>
</body>
</html>
